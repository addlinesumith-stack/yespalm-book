<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Unit Converter | YesPalm</title><meta name="description" content="Convert length, weight, temperature, and speed units instantly. Free online unit converter tool."><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f9fafb;color:#1f2937}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:1rem 0}nav{max-width:1200px;margin:0 auto;padding:0 1.5rem;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.5rem;font-weight:700;text-decoration:none;color:#1f2937}.logo span{color:#2563EB}.back-link{color:#6b7280;text-decoration:none}.container{max-width:800px;margin:2rem auto;padding:0 1.5rem}h1{font-size:2rem;margin-bottom:2rem}.tabs{display:flex;gap:1rem;border-bottom:2px solid #e5e7eb;margin-bottom:2rem}.tab{padding:0.75rem 1.5rem;cursor:pointer;border:none;background:none;font-size:1rem;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px}.tab.active{color:#2563EB;border-bottom-color:#2563EB}.converter{background:#fff;padding:2rem;border-radius:12px;border:1px solid #e5e7eb}.input-group{margin-bottom:1.5rem}label{display:block;margin-bottom:0.5rem;font-weight:600}input,select{width:100%;padding:0.75rem;border:2px solid #e5e7eb;border-radius:8px;font-size:1rem}input:focus,select:focus{outline:none;border-color:#2563EB}.result{background:#f3f4f6;padding:1.5rem;border-radius:8px;font-size:1.25rem;font-weight:600;color:#2563EB;text-align:center}.ad-slot{background:#f3f4f6;border:2px dashed #d1d5db;border-radius:8px;padding:1.5rem;text-align:center;color:#9ca3af;margin:1.5rem 0}footer{background:#1f2937;color:#9ca3af;padding:2rem 1.5rem;margin-top:4rem;text-align:center}footer a{color:#9ca3af;text-decoration:none}</style></head><body><header><nav><a href="/" class="logo">Yes<span>Palm</span></a><a href="/" class="back-link">← Back</a></nav></header><div class="container"><h1>📏 Unit Converter</h1><div class="ad-slot" id="ad-top">Advertisement</div><div class="tabs"><button class="tab active" onclick="switchTab('length')">Length</button><button class="tab" onclick="switchTab('weight')">Weight</button><button class="tab" onclick="switchTab('temperature')">Temperature</button><button class="tab" onclick="switchTab('speed')">Speed</button></div><div class="converter" id="length"><div class="input-group"><label>From</label><select id="lengthFrom"><option value="m">Meters</option><option value="km">Kilometers</option><option value="cm">Centimeters</option><option value="ft">Feet</option><option value="in">Inches</option><option value="mi">Miles</option></select></div><div class="input-group"><label>Value</label><input type="number" id="lengthValue" oninput="convertLength()" value="1"></div><div class="input-group"><label>To</label><select id="lengthTo" onchange="convertLength()"><option value="m">Meters</option><option value="km" selected>Kilometers</option><option value="cm">Centimeters</option><option value="ft">Feet</option><option value="in">Inches</option><option value="mi">Miles</option></select></div><div class="result" id="lengthResult">0.001 km</div></div><div class="ad-slot" id="ad-middle">Advertisement</div></div><footer><p>&copy; 2026 YesPalm. <a href="/privacy.html">Privacy</a></p></footer><div class="ad-slot">Advertisement</div><script>function switchTab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));event.target.classList.add('active');alert('Only Length converter is active. Other converters coming soon!')}function convertLength(){const v=parseFloat(document.getElementById('lengthValue').value)||0;const f=document.getElementById('lengthFrom').value;const t=document.getElementById('lengthTo').value;const u={m:1,km:0.001,cm:100,ft:3.28084,in:39.3701,mi:0.000621371};let m=v/u[f];let r=m*u[t];document.getElementById('lengthResult').textContent=r.toFixed(4)+' '+t}convertLength()</script></body></html>
