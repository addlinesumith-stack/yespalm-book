<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Calculate Your Body Mass Index | YesPalm</title>
    <meta name="description" content="Free BMI calculator with metric and imperial units. Calculate your body mass index and get health category classification instantly.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        .unit-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .unit-btn {
            padding: 10px 25px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .unit-btn.active {
            background: #667eea;
            color: white;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-calculate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            text-align: center;
            display: none;
        }
        .result.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bmi-value {
            font-size: 4em;
            font-weight: 700;
            color: #667eea;
            margin: 20px 0;
        }
        .bmi-category {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .category-underweight { color: #3b82f6; }
        .category-normal { color: #10b981; }
        .category-overweight { color: #f59e0b; }
        .category-obese { color: #ef4444; }
        .gauge-container {
            margin: 30px 0;
            position: relative;
        }
        .gauge {
            width: 100%;
            height: 30px;
            background: linear-gradient(to right, #3b82f6, #10b981, #f59e0b, #ef4444);
            border-radius: 15px;
            position: relative;
            overflow: visible;
        }
        .gauge-pointer {
            position: absolute;
            top: -10px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #333;
            transform: translateX(-50%);
            transition: left 0.5s ease;
        }
        .gauge-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.85em;
            color: #666;
        }
        .info-text {
            color: #666;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚖️ BMI Calculator</h1>
        <p class="subtitle">Calculate your Body Mass Index</p>
        
        <div class="unit-toggle">
            <button class="unit-btn active" onclick="setUnit('metric')" id="metricBtn">Metric</button>
            <button class="unit-btn" onclick="setUnit('imperial')" id="imperialBtn">Imperial</button>
        </div>
        
        <div id="metricInputs">
            <div class="input-group">
                <label for="heightCm">Height (cm)</label>
                <input type="number" id="heightCm" placeholder="170" min="50" max="300">
            </div>
            <div class="input-group">
                <label for="weightKg">Weight (kg)</label>
                <input type="number" id="weightKg" placeholder="70" min="20" max="300" step="0.1">
            </div>
        </div>
        
        <div id="imperialInputs" style="display: none;">
            <div class="input-group">
                <label for="heightFt">Height (feet)</label>
                <input type="number" id="heightFt" placeholder="5" min="3" max="8">
            </div>
            <div class="input-group">
                <label for="heightIn">Height (inches)</label>
                <input type="number" id="heightIn" placeholder="7" min="0" max="11">
            </div>
            <div class="input-group">
                <label for="weightLbs">Weight (lbs)</label>
                <input type="number" id="weightLbs" placeholder="154" min="50" max="600" step="0.1">
            </div>
        </div>
        
        <button class="btn-calculate" onclick="calculateBMI()">Calculate BMI</button>
        
        <div class="result" id="result">
            <div class="bmi-value" id="bmiValue">0.0</div>
            <div class="bmi-category" id="bmiCategory">Category</div>
            
            <div class="gauge-container">
                <div class="gauge">
                    <div class="gauge-pointer" id="gaugePointer"></div>
                </div>
                <div class="gauge-labels">
                    <span>Underweight</span>
                    <span>Normal</span>
                    <span>Overweight</span>
                    <span>Obese</span>
                </div>
            </div>
            
            <div class="info-text" id="infoText"></div>
        </div>
    </div>
    
    <script>
        let currentUnit = 'metric';
        
        function setUnit(unit) {
            currentUnit = unit;
            if (unit === 'metric') {
                document.getElementById('metricInputs').style.display = 'block';
                document.getElementById('imperialInputs').style.display = 'none';
                document.getElementById('metricBtn').classList.add('active');
                document.getElementById('imperialBtn').classList.remove('active');
            } else {
                document.getElementById('metricInputs').style.display = 'none';
                document.getElementById('imperialInputs').style.display = 'block';
                document.getElementById('metricBtn').classList.remove('active');
                document.getElementById('imperialBtn').classList.add('active');
            }
        }
        
        function calculateBMI() {
            let bmi;
            
            if (currentUnit === 'metric') {
                const height = parseFloat(document.getElementById('heightCm').value);
                const weight = parseFloat(document.getElementById('weightKg').value);
                
                if (!height || !weight || height <= 0 || weight <= 0) {
                    alert('Please enter valid height and weight values');
                    return;
                }
                
                const heightInMeters = height / 100;
                bmi = weight / (heightInMeters * heightInMeters);
            } else {
                const feet = parseFloat(document.getElementById('heightFt').value) || 0;
                const inches = parseFloat(document.getElementById('heightIn').value) || 0;
                const weight = parseFloat(document.getElementById('weightLbs').value);
                
                if (!weight || weight <= 0 || (feet === 0 && inches === 0)) {
                    alert('Please enter valid height and weight values');
                    return;
                }
                
                const totalInches = (feet * 12) + inches;
                bmi = (weight / (totalInches * totalInches)) * 703;
            }
            
            displayResult(bmi);
        }
        
        function displayResult(bmi) {
            const resultDiv = document.getElementById('result');
            const bmiValue = document.getElementById('bmiValue');
            const bmiCategory = document.getElementById('bmiCategory');
            const infoText = document.getElementById('infoText');
            const pointer = document.getElementById('gaugePointer');
            
            bmiValue.textContent = bmi.toFixed(1);
            
            let category, className, info, pointerPosition;
            
            if (bmi < 18.5) {
                category = 'Underweight';
                className = 'category-underweight';
                info = 'You are underweight. Consider consulting with a healthcare provider about achieving a healthy weight.';
                pointerPosition = (bmi / 18.5) * 25;
            } else if (bmi >= 18.5 && bmi < 25) {
                category = 'Normal Weight';
                className = 'category-normal';
                info = 'You have a healthy weight. Keep maintaining your current lifestyle and healthy habits!';
                pointerPosition = 25 + ((bmi - 18.5) / (25 - 18.5)) * 25;
            } else if (bmi >= 25 && bmi < 30) {
                category = 'Overweight';
                className = 'category-overweight';
                info = 'You are overweight. Consider adopting a healthier diet and increasing physical activity.';
                pointerPosition = 50 + ((bmi - 25) / (30 - 25)) * 25;
            } else {
                category = 'Obese';
                className = 'category-obese';
                info = 'You are in the obese range. It\'s recommended to consult with a healthcare professional for personalized advice.';
                pointerPosition = 75 + Math.min(((bmi - 30) / 10) * 25, 25);
            }
            
            bmiCategory.textContent = category;
            bmiCategory.className = 'bmi-category ' + className;
            infoText.textContent = info;
            pointer.style.left = Math.min(pointerPosition, 100) + '%';
            
            resultDiv.classList.add('show');
        }
        
        // Allow Enter key to calculate
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') calculateBMI();
            });
        });
    </script>
</body>
</html>
