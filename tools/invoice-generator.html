<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Invoice Generator - Create Professional Invoices | YesPalm</title>
    <meta name="description" content="Generate professional invoices instantly. Free invoice generator with business details, itemized billing, and print/PDF export. No signup required.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 0.9em;
        }
        input, textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .items-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #667eea;
        }
        .items-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        .items-table input {
            width: 100%;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-left: 10px;
        }
        .btn-add {
            background: #28a745;
            color: white;
            margin-top: 10px;
        }
        .btn-remove {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .total-section {
            text-align: right;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .total-section h3 {
            color: #333;
            font-size: 1.5em;
        }
        .total-amount {
            color: #667eea;
            font-size: 2em;
            font-weight: 700;
            margin-top: 10px;
        }
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
            }
            .form-section:first-child,
            .actions,
            .btn {
                display: none;
            }
        }
        .preview {
            margin-top: 30px;
            padding: 30px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }
        .preview h2 {
            color: #667eea;
            font-size: 2em;
        }
        .preview-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Invoice Generator</h1>
        
        <div class="form-section">
            <h2>Business Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" id="businessName" placeholder="Your Company Name">
                </div>
                <div class="form-group">
                    <label>Invoice Number</label>
                    <input type="text" id="invoiceNumber" placeholder="INV-001">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Business Address</label>
                    <textarea id="businessAddress" placeholder="Street Address, City, State, ZIP"></textarea>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="invoiceDate">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Client Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Client Name</label>
                    <input type="text" id="clientName" placeholder="Client Company Name">
                </div>
                <div class="form-group">
                    <label>Client Email</label>
                    <input type="email" id="clientEmail" placeholder="client@example.com">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Client Address</label>
                    <textarea id="clientAddress" placeholder="Street Address, City, State, ZIP"></textarea>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2>Invoice Items</h2>
            <table class="items-table" id="itemsTable">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th style="width: 100px;">Quantity</th>
                        <th style="width: 120px;">Price</th>
                        <th style="width: 120px;">Total</th>
                        <th style="width: 80px;">Action</th>
                    </tr>
                </thead>
                <tbody id="itemsBody">
                    <tr>
                        <td><input type="text" class="item-desc" placeholder="Service or product description"></td>
                        <td><input type="number" class="item-qty" value="1" min="1"></td>
                        <td><input type="number" class="item-price" value="0" min="0" step="0.01"></td>
                        <td><input type="number" class="item-total" readonly></td>
                        <td><button class="btn btn-remove" onclick="removeRow(this)">Remove</button></td>
                    </tr>
                </tbody>
            </table>
            <button class="btn btn-add" onclick="addRow()">+ Add Item</button>
        </div>

        <div class="total-section">
            <h3>Total Amount</h3>
            <div class="total-amount" id="totalAmount">$0.00</div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
            <button class="btn btn-secondary" onclick="resetForm()">Reset Form</button>
        </div>
    </div>

    <script>
        // Set today's date
        document.getElementById('invoiceDate').valueAsDate = new Date();

        function calculateRowTotal(row) {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            const total = qty * price;
            row.querySelector('.item-total').value = total.toFixed(2);
            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            const rows = document.querySelectorAll('#itemsBody tr');
            let grandTotal = 0;
            rows.forEach(row => {
                const total = parseFloat(row.querySelector('.item-total').value) || 0;
                grandTotal += total;
            });
            document.getElementById('totalAmount').textContent = '$' + grandTotal.toFixed(2);
        }

        function addRow() {
            const tbody = document.getElementById('itemsBody');
            const newRow = tbody.rows[0].cloneNode(true);
            newRow.querySelectorAll('input').forEach(input => {
                if (!input.classList.contains('item-total')) {
                    input.value = input.type === 'number' ? (input.classList.contains('item-qty') ? '1' : '0') : '';
                } else {
                    input.value = '';
                }
            });
            tbody.appendChild(newRow);
            attachEventListeners(newRow);
        }

        function removeRow(btn) {
            const tbody = document.getElementById('itemsBody');
            if (tbody.rows.length > 1) {
                btn.closest('tr').remove();
                calculateGrandTotal();
            } else {
                alert('At least one item is required');
            }
        }

        function resetForm() {
            if (confirm('Are you sure you want to reset the form?')) {
                document.querySelectorAll('input:not([type="date"]), textarea').forEach(input => {
                    input.value = '';
                });
                document.getElementById('invoiceDate').valueAsDate = new Date();
                const tbody = document.getElementById('itemsBody');
                while (tbody.rows.length > 1) {
                    tbody.deleteRow(1);
                }
                calculateGrandTotal();
            }
        }

        function attachEventListeners(row) {
            row.querySelector('.item-qty').addEventListener('input', () => calculateRowTotal(row));
            row.querySelector('.item-price').addEventListener('input', () => calculateRowTotal(row));
        }

        // Attach event listeners to initial row
        document.querySelectorAll('#itemsBody tr').forEach(attachEventListeners);
    </script>
</body>
</html>
