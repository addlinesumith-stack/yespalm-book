<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - Free Link Shortening Tool | YesPalm</title>
    <meta name="description" content="Free URL shortener tool to create short, memorable links. Perfect for social media, marketing campaigns, and sharing long URLs easily.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="url"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .result.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .short-url {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .short-url input {
            flex: 1;
        }
        .copy-btn {
            width: auto;
            padding: 15px 30px;
            background: #28a745;
        }
        .copy-btn:hover {
            background: #218838;
        }
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
        }
        .info h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        .info p {
            color: #856404;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        <p class="subtitle">Create short, memorable links instantly</p>
        
        <div class="input-group">
            <label for="longUrl">Enter your long URL:</label>
            <input type="url" id="longUrl" placeholder="https://example.com/very-long-url-here" required>
        </div>
        
        <div class="input-group">
            <label for="customAlias">Custom alias (optional):</label>
            <input type="text" id="customAlias" placeholder="my-link" maxlength="20">
        </div>
        
        <button onclick="shortenUrl()">Shorten URL</button>
        
        <div class="result" id="result">
            <strong>Your shortened URL:</strong>
            <div class="short-url">
                <input type="text" id="shortUrl" readonly>
                <button class="copy-btn" onclick="copyUrl()">Copy</button>
            </div>
        </div>
        
        <div class="info">
            <h3>ℹ️ Note</h3>
            <p>This is a demo URL shortener. The shortened URLs are generated locally and won't redirect to your original URL. For a fully functional URL shortener, you would need a backend service to store and redirect URLs.</p>
        </div>
    </div>
    
    <script>
        function generateShortCode(length = 6) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
        
        function shortenUrl() {
            const longUrl = document.getElementById('longUrl').value;
            const customAlias = document.getElementById('customAlias').value;
            
            if (!longUrl) {
                alert('Please enter a URL to shorten');
                return;
            }
            
            try {
                new URL(longUrl);
            } catch (e) {
                alert('Please enter a valid URL (include http:// or https://)');
                return;
            }
            
            const shortCode = customAlias || generateShortCode();
            const shortUrl = `https://short.link/${shortCode}`;
            
            document.getElementById('shortUrl').value = shortUrl;
            document.getElementById('result').classList.add('show');
        }
        
        function copyUrl() {
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.select();
            document.execCommand('copy');
            
            const copyBtn = event.target;
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 2000);
        }
        
        document.getElementById('longUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                shortenUrl();
            }
        });
    </script>
</body>
</html>
