<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer - Productivity Timer | YesPalm</title>
    <meta name="description" content="Free Pomodoro Timer with 25-minute work sessions and 5-minute breaks. Boost productivity with sound notifications and session tracking.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1em;
        }
        .timer-display {
            font-size: 6em;
            font-weight: 700;
            color: #667eea;
            margin: 40px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
        }
        .session-type {
            display: inline-block;
            padding: 10px 25px;
            background: #f0f4ff;
            border-radius: 20px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .session-type.break {
            background: #e8f5e9;
            color: #4caf50;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .btn {
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }
        .stat-box {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #333;
            font-size: 2em;
            font-weight: 700;
        }
        .progress-ring {
            transform: rotate(-90deg);
            margin: 30px auto;
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.3s;
            stroke: #667eea;
            stroke-width: 8;
        }
        .progress-ring-bg {
            stroke: #f0f0f0;
            stroke-width: 8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Pomodoro Timer</h1>
        <p class="subtitle">Stay focused and productive</p>
        
        <div class="session-type" id="sessionType">Work Session</div>
        
        <svg class="progress-ring" width="200" height="200">
            <circle class="progress-ring-bg" cx="100" cy="100" r="90" fill="none"></circle>
            <circle class="progress-ring-circle" id="progressCircle" cx="100" cy="100" r="90" 
                    fill="none" stroke-dasharray="565.48" stroke-dashoffset="0"></circle>
        </svg>
        
        <div class="timer-display" id="timerDisplay">25:00</div>
        
        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Start</button>
            <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Completed Sessions</div>
                <div class="stat-value" id="sessionsCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Focus Time</div>
                <div class="stat-value" id="totalTime">0m</div>
            </div>
        </div>
    </div>
    
    <audio id="notificationSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUKbj8LZjHAU7k9n0y3kqBSh+zPLaizsKGGS569+gUBELTKXh8bllHgU2jdXzzn0vBSl7yvHdizwLFmO56+CgUBEKTKXh8bllHgU2jdXzzn0vBSl7yvHdizwLFmO56+CgUBEKTKXh8bllHgU2jdXzzn0vBSl7yvHdizwL" type="audio/wav">
    </audio>

    <script>
        let timeLeft = 25 * 60; // 25 minutes in seconds
        let isWorkSession = true;
        let isRunning = false;
        let timerInterval = null;
        let completedSessions = 0;
        let totalFocusTime = 0;
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;

        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const sessionType = document.getElementById('sessionType');
        const progressCircle = document.getElementById('progressCircle');
        const circumference = 2 * Math.PI * 90;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const totalTime = isWorkSession ? WORK_TIME : BREAK_TIME;
            const progress = (totalTime - timeLeft) / totalTime;
            const offset = circumference * progress;
            progressCircle.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            startBtn.textContent = 'Pause';
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    completeSession();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            startBtn.textContent = 'Resume';
            clearInterval(timerInterval);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isWorkSession = true;
            timeLeft = WORK_TIME;
            startBtn.textContent = 'Start';
            sessionType.textContent = 'Work Session';
            sessionType.classList.remove('break');
            updateDisplay();
        }

        function completeSession() {
            playNotification();
            clearInterval(timerInterval);
            isRunning = false;
            
            if (isWorkSession) {
                completedSessions++;
                totalFocusTime += 25;
                document.getElementById('sessionsCount').textContent = completedSessions;
                document.getElementById('totalTime').textContent = totalFocusTime + 'm';
                
                // Switch to break
                isWorkSession = false;
                timeLeft = BREAK_TIME;
                sessionType.textContent = 'Break Time';
                sessionType.classList.add('break');
                startBtn.textContent = 'Start Break';
            } else {
                // Switch to work
                isWorkSession = true;
                timeLeft = WORK_TIME;
                sessionType.textContent = 'Work Session';
                sessionType.classList.remove('break');
                startBtn.textContent = 'Start';
            }
            
            updateDisplay();
        }

        function playNotification() {
            const audio = document.getElementById('notificationSound');
            audio.play().catch(e => console.log('Audio play failed:', e));
            
            // Also show browser notification if permitted
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('Pomodoro Timer', {
                    body: isWorkSession ? 'Work session complete! Time for a break.' : 'Break is over! Ready to focus?',
                    icon: '⏱️'
                });
            }
        }

        // Request notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Initialize display
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        progressCircle.style.strokeDashoffset = 0;
        updateDisplay();
    </script>
</body>
</html>
