<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Keywords Analyzer - Match Your Resume to Job Description | YesPalm</title>
    <meta name="description" content="Analyze your resume against job descriptions. Identify matching keywords, calculate match percentage, and optimize your resume for ATS systems.">
    <link rel="stylesheet" href="../style.css">
    <style>
        .tool-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1f2937;
        }
        .input-group textarea {
            padding: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 300px;
        }
        .input-group textarea:focus {
            outline: none;
            border-color: #2563EB;
        }
        .analyze-btn {
            background: linear-gradient(135deg, #2563EB 0%, #1e40af 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .analyze-btn:hover {
            transform: translateY(-2px);
        }
        .results {
            display: none;
            margin-top: 2rem;
        }
        .results.active {
            display: block;
        }
        .match-percentage {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
        }
        .match-percentage h2 {
            font-size: 3rem;
            margin: 0;
        }
        .match-percentage p {
            font-size: 1.2rem;
            margin: 0.5rem 0 0 0;
        }
        .keywords-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 768px) {
            .keywords-section {
                grid-template-columns: 1fr;
            }
        }
        .keyword-box {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 1.5rem;
        }
        .keyword-box h3 {
            margin-top: 0;
            color: #1f2937;
        }
        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .keyword-tag {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .keyword-matched {
            background: #d1fae5;
            color: #065f46;
        }
        .keyword-missing {
            background: #fee2e2;
            color: #991b1b;
        }
        .suggestions {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 1.5rem;
        }
        .suggestions h3 {
            margin-top: 0;
            color: #92400e;
        }
        .suggestions ul {
            margin: 0;
            padding-left: 1.5rem;
        }
        .suggestions li {
            margin-bottom: 0.5rem;
            color: #78350f;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">YesPalm</div>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#tools">Tools</a></li>
                <li><a href="#blog">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main class="tool-container">
        <h1>Resume Keywords Analyzer</h1>
        <p style="color: #6b7280; margin-bottom: 2rem;">Optimize your resume for ATS systems by analyzing keyword matches with job descriptions.</p>

        <div class="input-section">
            <div class="input-group">
                <label for="jobDescription">Job Description</label>
                <textarea id="jobDescription" placeholder="Paste the job description here..."></textarea>
            </div>
            <div class="input-group">
                <label for="resume">Your Resume</label>
                <textarea id="resume" placeholder="Paste your resume text here..."></textarea>
            </div>
        </div>

        <button class="analyze-btn" onclick="analyzeResume()">Analyze Match</button>

        <div class="results" id="results">
            <div class="match-percentage">
                <h2 id="matchScore">0%</h2>
                <p>Match Score</p>
            </div>

            <div class="keywords-section">
                <div class="keyword-box">
                    <h3>✅ Matched Keywords</h3>
                    <div class="keyword-list" id="matchedKeywords"></div>
                </div>
                <div class="keyword-box">
                    <h3>❌ Missing Keywords</h3>
                    <div class="keyword-list" id="missingKeywords"></div>
                </div>
            </div>

            <div class="suggestions">
                <h3>💡 Suggestions to Improve Your Match</h3>
                <ul id="suggestionsList"></ul>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 YesPalm. All rights reserved.</p>
    </footer>

    <script>
        function analyzeResume() {
            const jobDesc = document.getElementById('jobDescription').value.toLowerCase();
            const resume = document.getElementById('resume').value.toLowerCase();

            if (!jobDesc || !resume) {
                alert('Please fill in both the job description and your resume.');
                return;
            }

            // Extract keywords (words with 4+ characters, excluding common words)
            const commonWords = ['the', 'and', 'for', 'with', 'this', 'that', 'from', 'have', 'will', 'your', 'their', 'what', 'about', 'which', 'when', 'where', 'who', 'been', 'into', 'than', 'them', 'these', 'would', 'could', 'should'];
            
            const extractKeywords = (text) => {
                return text
                    .replace(/[^a-z0-9\s+#\.]/g, ' ')
                    .split(/\s+/)
                    .filter(word => word.length >= 3 && !commonWords.includes(word))
                    .filter(word => /[a-z]/.test(word));
            };

            const jobKeywords = [...new Set(extractKeywords(jobDesc))];
            const resumeKeywords = new Set(extractKeywords(resume));

            const matched = jobKeywords.filter(keyword => resumeKeywords.has(keyword));
            const missing = jobKeywords.filter(keyword => !resumeKeywords.has(keyword));

            const matchPercentage = Math.round((matched.length / jobKeywords.length) * 100);

            // Display results
            document.getElementById('matchScore').textContent = matchPercentage + '%';
            
            const matchedEl = document.getElementById('matchedKeywords');
            matchedEl.innerHTML = matched.slice(0, 30).map(kw => 
                `<span class="keyword-tag keyword-matched">${kw}</span>`
            ).join('');

            const missingEl = document.getElementById('missingKeywords');
            missingEl.innerHTML = missing.slice(0, 30).map(kw => 
                `<span class="keyword-tag keyword-missing">${kw}</span>`
            ).join('');

            // Generate suggestions
            const suggestions = [];
            if (matchPercentage < 50) {
                suggestions.push('Your resume has low keyword match. Consider incorporating more relevant keywords from the job description.');
            }
            if (missing.length > 10) {
                suggestions.push(`Add ${missing.slice(0, 5).join(', ')} to your resume if applicable to your experience.`);
            }
            if (matched.length > 0) {
                suggestions.push('Great! You have several matching keywords. Make sure they appear in context throughout your resume.');
            }
            suggestions.push('Use exact phrases from the job description where truthful and relevant.');
            suggestions.push('Tailor your resume for each application to improve ATS compatibility.');

            const suggestionsEl = document.getElementById('suggestionsList');
            suggestionsEl.innerHTML = suggestions.map(s => `<li>${s}</li>`).join('');

            document.getElementById('results').classList.add('active');
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
