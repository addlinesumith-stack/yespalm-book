<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor - Live Preview | YesPalm</title>
    <meta name="description" content="Free online Markdown editor with live preview. Write markdown on the left, see formatted output on the right instantly.">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            background: #667eea;
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 150px);
        }
        .editor-pane, .preview-pane {
            padding: 30px;
            overflow-y: auto;
        }
        .editor-pane {
            border-right: 2px solid #e0e0e0;
        }
        .pane-header {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            font-size: 1.1em;
        }
        #markdown-input {
            width: 100%;
            min-height: calc(100vh - 250px);
            border: none;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            outline: none;
            color: #333;
        }
        #preview {
            line-height: 1.8;
            color: #333;
        }
        #preview h1 {
            font-size: 2em;
            margin: 20px 0 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        #preview h2 {
            font-size: 1.6em;
            margin: 18px 0 12px;
            color: #444;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }
        #preview h3 {
            font-size: 1.3em;
            margin: 15px 0 10px;
            color: #555;
        }
        #preview p {
            margin: 12px 0;
        }
        #preview ul, #preview ol {
            margin: 12px 0;
            padding-left: 30px;
        }
        #preview li {
            margin: 6px 0;
        }
        #preview code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.9em;
            color: #e83e8c;
        }
        #preview pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }
        #preview pre code {
            background: none;
            color: #f8f8f2;
            padding: 0;
        }
        #preview blockquote {
            border-left: 4px solid #667eea;
            padding-left: 20px;
            margin: 15px 0;
            color: #666;
            font-style: italic;
        }
        #preview a {
            color: #667eea;
            text-decoration: none;
        }
        #preview a:hover {
            text-decoration: underline;
        }
        #preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        #preview th, #preview td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        #preview th {
            background: #f5f5f5;
            font-weight: 600;
        }
        #preview img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #667eea;
        }
        .btn:hover {
            background: rgba(255,255,255,0.9);
        }
        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
            .editor-pane {
                border-right: none;
                border-bottom: 2px solid #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Markdown Editor</h1>
            <button class="btn" onclick="clearEditor()">Clear</button>
        </div>
        <div class="editor-container">
            <div class="editor-pane">
                <div class="pane-header">Markdown Input</div>
                <textarea id="markdown-input" placeholder="# Welcome to Markdown Editor

Start typing your markdown here...

## Features
- Live preview
- Split-screen editing
- Supports all markdown syntax

**Bold text** and *italic text*

```javascript
const hello = 'world';
```

[Links](https://example.com)

> Blockquotes

| Tables | Are | Supported |
|--------|-----|----------|
| Cell 1 | Cell 2 | Cell 3 |"></textarea>
            </div>
            <div class="preview-pane">
                <div class="pane-header">Live Preview</div>
                <div id="preview"></div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('markdown-input');
        const preview = document.getElementById('preview');

        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        function updatePreview() {
            const markdown = input.value;
            preview.innerHTML = marked.parse(markdown);
        }

        function clearEditor() {
            if (confirm('Are you sure you want to clear the editor?')) {
                input.value = '';
                updatePreview();
            }
        }

        // Update preview on input
        input.addEventListener('input', updatePreview);

        // Initialize with default content
        updatePreview();

        // Auto-resize textarea
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
    </script>
</body>
</html>
