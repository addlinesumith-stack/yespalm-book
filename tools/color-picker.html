<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker - HEX RGB HSL Color Tool | YesPalm</title>
    <meta name="description" content="Free visual color picker tool. Get HEX, RGB, and HSL color values instantly. Copy any format with one click for web design and development.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; text-align: center; font-size: 2em; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; }
        .color-display {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 3px solid #e0e0e0;
            transition: all 0.3s;
        }
        .picker-container { margin-bottom: 30px; }
        .picker-label { font-weight: 600; color: #555; margin-bottom: 10px; }
        input[type="color"] {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .values-grid { display: grid; gap: 15px; margin-bottom: 20px; }
        .value-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .value-label { font-weight: 600; color: #555; }
        .value-content { display: flex; align-items: center; gap: 10px; }
        .value-text {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 16px;
            color: #333;
        }
        .btn-copy {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-copy:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Color Picker</h1>
        <p class="subtitle">Pick a color and get all values</p>
        
        <div class="color-display" id="colorDisplay"></div>
        
        <div class="picker-container">
            <div class="picker-label">Choose Color:</div>
            <input type="color" id="colorPicker" value="#667eea">
        </div>
        
        <div class="values-grid">
            <div class="value-box">
                <div class="value-label">HEX</div>
                <div class="value-content">
                    <span class="value-text" id="hexValue">#667eea</span>
                    <button class="btn-copy" onclick="copyValue('hex')">Copy</button>
                </div>
            </div>
            <div class="value-box">
                <div class="value-label">RGB</div>
                <div class="value-content">
                    <span class="value-text" id="rgbValue">rgb(102, 126, 234)</span>
                    <button class="btn-copy" onclick="copyValue('rgb')">Copy</button>
                </div>
            </div>
            <div class="value-box">
                <div class="value-label">HSL</div>
                <div class="value-content">
                    <span class="value-text" id="hslValue">hsl(230, 77%, 66%)</span>
                    <button class="btn-copy" onclick="copyValue('hsl')">Copy</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const colorPicker = document.getElementById('colorPicker');
        const colorDisplay = document.getElementById('colorDisplay');
        const hexValue = document.getElementById('hexValue');
        const rgbValue = document.getElementById('rgbValue');
        const hslValue = document.getElementById('hslValue');
        
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
        
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            
            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }
        
        function updateColorValues(hex) {
            colorDisplay.style.backgroundColor = hex;
            hexValue.textContent = hex.toUpperCase();
            
            const rgb = hexToRgb(hex);
            if (rgb) {
                rgbValue.textContent = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
                
                const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
                hslValue.textContent = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
            }
        }
        
        colorPicker.addEventListener('input', function() {
            updateColorValues(this.value);
        });
        
        function copyValue(type) {
            let text;
            if (type === 'hex') text = hexValue.textContent;
            else if (type === 'rgb') text = rgbValue.textContent;
            else if (type === 'hsl') text = hslValue.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }
        
        // Initialize with default color
        updateColorValues('#667eea');
    </script>
</body>
</html>
